[project]
name = "clinic-management-system"
version = "0.1.0"
description = ""
authors = [
    {name = "Anton Danilyuk",email = "danilyuk.anton2023@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "aiosmtplib (>=5.1.2,<6.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "resend (>=2.34.0,<3.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
]

[tool.poetry]
packages = [
    { include = "app", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "black (>=26.5.1,<27.0.0)"
]
