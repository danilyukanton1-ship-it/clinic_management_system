services:
  app:
    build:
      context: .
      target: development

    container_name: cms_app

    environment:
      PYTHONPATH: /opt/pysetup/src

    env_file:
      - .env

    volumes:
      - .:/opt/pysetup
      - /opt/pysetup/.venv

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: unless-stopped

    command: uvicorn src.main:app --host 0.0.0.0 --reload

  celery-worker:
    build:
      context: .
      target: development

    container_name: cms_celery_worker

    environment:
      PYTHONPATH: /opt/pysetup/src

    env_file:
      - .env

    volumes:
      - .:/opt/pysetup
      - /opt/pysetup/.venv

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: unless-stopped

    command: celery -A src.infrastructure.celery:celery_app worker --pool=solo --loglevel=info

  celery-beat:
    build:
      context: .
      target: development

    container_name: cms_celery_beat

    environment:
      PYTHONPATH: /opt/pysetup/src

    env_file:
      - .env

    volumes:
      - .:/opt/pysetup
      - /opt/pysetup/.venv

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: unless-stopped

    command: celery -A src.infrastructure.celery beat --loglevel=info

  postgres:
    image: postgres:17
    container_name: clinic_management_postgres

    environment:
      POSTGRES_DB: clinic_management_database
      POSTGRES_USER: clinic_management_system
      POSTGRES_PASSWORD: clinic_management_system_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_management_system -d clinic_management_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: clinic_management_redis

    ports:
      - "6379:6379"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: clinic_management_rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5


  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: minio
    command: server /data --console-address ":9001"
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9000:9000"
      - "9001:9001"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - minio_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: clinic_management_redisinsight
    restart: always
    depends_on:
      - redis
    ports:
     - "5540:5540"
    volumes:
     - redis-insight:/data

volumes:
  postgres_data:
  minio_data:
  redis-insight: